name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run tests (sin Q#)
        run: pytest -v --ignore=tests/test_circuit_parity.py -k "not qsharp" || pytest -v -k "not qsharp"

  parity-qsharp:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install all deps (incl. qsharp)
        run: |
          python -m pip install --upgrade pip
          pip install .[all]
      - name: Run parity tests
        run: pytest -v tests/test_circuit_parity.py
