[project]
name = "quantum-classifier"
version = "0.1.0"
description = "Clasificador Cuántico Variacional (VQC) híbrido — simulador numpy por defecto, Q# opcional"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
quantum = ["qsharp>=1.0"]
dev = ["pytest>=7.0", "jupyter>=1.0"]
all = ["qsharp>=1.0", "pytest>=7.0", "jupyter>=1.0"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
